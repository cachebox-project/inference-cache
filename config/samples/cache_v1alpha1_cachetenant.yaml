# Kubebuilder-generated minimum-viable sample: a minimal CacheTenant that
# applies cleanly against the current schema. Populates maxIndexEntries only.
apiVersion: inferencecache.io/v1alpha1
kind: CacheTenant
metadata:
  labels:
    app.kubernetes.io/name: inference-cache
  name: cachetenant-sample
spec:
  tenantID: tenant-a
  isolationMode: Fairness
  quota:
    maxIndexEntries: 100000
