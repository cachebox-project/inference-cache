# Typed vLLM PodLocal LMCache MP with no remote tier. CacheBackend injects the
# MP server sidecar and connector JSON but never changes the engine image. The
# engine's normal startup fails before serving if its image lacks a compatible
# LMCache client/API; no capability annotation is required.
apiVersion: inferencecache.io/v1alpha1
kind: CacheBackend
metadata:
  name: vllm-podlocal-host-only
spec:
  runtime: VLLM
  type: LMCache
  integration:
    role: ReadWrite
  engineSelector:
    matchLabels:
      inferencecache.io/runtime: vllm-mp
  lmCache:
    topology: PodLocal
    chunkSizeTokens: 256
    podLocal:
      server:
        image: docker.io/lmcache/standalone@sha256:b813bf0bb616d1012b6a6edcbd4a44f1576dbbdaa857962e56d48b9f7c127d13
        port: 5555
        l1Capacity: 4Gi
        maxWorkers: 4
        resources:
          requests:
            cpu: "1"
            memory: 5Gi
          limits:
            cpu: "2"
            memory: 6Gi
  observation:
    modelID: meta-llama/Meta-Llama-3-8B-Instruct
