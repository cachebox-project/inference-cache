apiVersion: inferencecache.io/v1alpha1
kind: CacheBackend
metadata:
  name: sglang-hicache
spec:
  type: SGLangHiCache
  integration:
    engine: sglang
  engineSelector:
    matchLabels:
      app: sglang
  hiCache:
    ratio: "2.0"
    writePolicy: write_through
    ioBackend: kernel
    memoryLayout: layer_first
  # Optional: enables the KV-event subscriber when the controller was started
  # with --kvevent-subscriber-image.
  backendConfig:
    model: meta-llama/Meta-Llama-3-8B-Instruct
