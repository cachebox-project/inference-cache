# Typed vLLM PodLocal LMCache MP with externally managed Redis. Create
# Secret/redis-auth with key password in this namespace before starting
# matching engines. LMCache 0.5.3 RESP supports authentication but not TLS, so
# keep the endpoint on a trusted private network; admission rejects an inert TLS
# block rather than silently sending plaintext.
apiVersion: inferencecache.io/v1alpha1
kind: CacheBackend
metadata:
  name: vllm-podlocal-external-redis
spec:
  runtime: VLLM
  type: LMCache
  integration:
    role: ReadWrite
  engineSelector:
    matchLabels:
      inferencecache.io/runtime: vllm-mp-external-redis
  lmCache:
    topology: PodLocal
    chunkSizeTokens: 256
    podLocal:
      server:
        image: docker.io/lmcache/standalone@sha256:b813bf0bb616d1012b6a6edcbd4a44f1576dbbdaa857962e56d48b9f7c127d13
        port: 5555
        l1Capacity: 4Gi
        maxWorkers: 4
        resources:
          requests:
            cpu: "1"
            memory: 5Gi
          limits:
            cpu: "2"
            memory: 6Gi
  remoteStorage:
    provider: Redis
    ownership: External
    endpoint: redis.example.internal:6379
    redis:
      authentication:
        password:
          name: redis-auth
          key: password
  observation:
    modelID: meta-llama/Meta-Llama-3-8B-Instruct
