# Paired typed-MP sample: one CacheBackend and one matching vLLM Deployment.
# The `inferencecache.io/cache-domain: qwen-demo` label is the binding; at Pod
# CREATE the webhook injects
# an LMCache MP native sidecar and the vLLM LMCacheMPConnector JSON. This example
# intentionally omits remoteStorage, so L1 is per Pod and no cross-Pod sharing
# is claimed. The engine image remains inference-owner supplied: normal engine
# startup is the authoritative check that it contains a compatible LMCache
# client. Kubernetes 1.29 or newer is required for the native sidecar.
apiVersion: inferencecache.io/v1alpha1
kind: CacheBackend
metadata:
  name: qwen-demo-cache
spec:
  runtime: VLLM
  type: LMCache
  integration:
    role: ReadWrite
  engineSelector:
    matchLabels:
      inferencecache.io/cache-domain: qwen-demo # <-- ownership domain (1 of 2)
  observation:
    # Served model the engine pods are loaded with. Plumbed to the
    # auto-attached kvevent-subscriber sidecar so the index keys
    # per-replica entries by model.
    modelID: Qwen/Qwen2.5-0.5B-Instruct
  lmCache:
    topology: PodLocal
    chunkSizeTokens: 256
    podLocal:
      server:
        image: docker.io/lmcache/standalone@sha256:b813bf0bb616d1012b6a6edcbd4a44f1576dbbdaa857962e56d48b9f7c127d13
        port: 5555
        l1Capacity: 4Gi
        maxWorkers: 4
        resources:
          requests:
            cpu: "1"
            memory: 5Gi
          limits:
            cpu: "2"
            memory: 6Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qwen-engine
  labels:
    app: qwen-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: qwen-demo
  template:
    metadata:
      labels:
        app: qwen-demo
        inferencecache.io/cache-domain: qwen-demo # <-- ownership domain (2 of 2)
    spec:
      containers:
        - name: vllm
          # vLLM's dedicated CPU image. Arch-specific — swap to
          # `:latest-arm64` on Apple Silicon hosts.
          image: vllm/vllm-openai-cpu:latest-x86_64
          imagePullPolicy: IfNotPresent
          command: ["vllm", "serve", "Qwen/Qwen2.5-0.5B-Instruct"]
          args:
            - "--port=8000"
            - "--dtype=bfloat16"
            - "--max-model-len=8192"
            - "--enforce-eager"
            - "--enable-prefix-caching"
          env:
            - name: VLLM_CPU_KVCACHE_SPACE
              value: "4"
          ports:
            - { name: http, containerPort: 8000 }
          readinessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 60
            periodSeconds: 10
            failureThreshold: 120
          resources:
            requests:
              cpu: "500m"
              memory: "6Gi"
          volumeMounts:
            - { name: cache-home, mountPath: /root/.cache/huggingface }
            - { name: shm, mountPath: /dev/shm }
      volumes:
        - name: cache-home
          emptyDir: {}
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 5Gi
