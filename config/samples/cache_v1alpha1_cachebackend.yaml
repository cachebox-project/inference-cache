# Kubebuilder-generated minimum-viable sample: a minimal CacheBackend that
# applies cleanly against the current schema + admission webhook. Hand-curated,
# scenario-specific recipes live in the sibling cachebackend-*.yaml files.
#
# The runtime, engine cache, and remote provider are explicit so this minimum
# sample also demonstrates the canonical API hierarchy. Admission still
# defaults deploymentKind=Deployment, replicas=1, integration.role=ReadWrite,
# integration.failOpen=true, and integration.firstEventTimeout=5m.
apiVersion: inferencecache.io/v1alpha1
kind: CacheBackend
metadata:
  labels:
    app.kubernetes.io/name: inference-cache
    app.kubernetes.io/managed-by: kustomize
  name: cachebackend-sample
spec:
  runtime: VLLM
  type: LMCache
  engineSelector:
    matchLabels:
      inferencecache.io/cache-enabled: "true"
  observation:
    modelID: meta-llama/Meta-Llama-3-8B-Instruct
  remoteStorage:
    provider: LMCacheServer
    ownership: Managed
    lmCacheServer: {}
