# Typed vLLM PodLocal LMCache MP with an externally managed Redis L3. The
# controller provisions no remote provider workload; the injected MP server
# sidecar connects to spec.remoteStorage.endpoint. The endpoint is RESP on a
# trusted private network: LMCache 0.5.3 authentication is supported, but TLS is
# not, and admission rejects a TLS block rather than silently ignoring it.
#
# This sample explicitly chooses Redis. A removed external LMCacheServer endpoint
# cannot be converted automatically because replacing its IP wire changes sharing and
# data-plane semantics.
apiVersion: inferencecache.io/v1alpha1
kind: CacheBackend
metadata:
  labels:
    app.kubernetes.io/name: inference-cache
  name: cachebackend-external
spec:
  runtime: VLLM
  type: LMCache
  integration:
    role: ReadWrite
  engineSelector:
    matchLabels:
      app.kubernetes.io/name: vllm
  lmCache:
    topology: PodLocal
    chunkSizeTokens: 256
    podLocal:
      server:
        image: docker.io/lmcache/standalone@sha256:b813bf0bb616d1012b6a6edcbd4a44f1576dbbdaa857962e56d48b9f7c127d13
        port: 5555
        l1Capacity: 4Gi
        maxWorkers: 4
        resources:
          requests:
            cpu: "1"
            memory: 5Gi
          limits:
            cpu: "2"
            memory: 6Gi
  remoteStorage:
    provider: Redis
    ownership: External
    endpoint: redis.example.internal:6379
