# Typed SGLang PodLocal LMCache MP with a controller-managed Redis L3. The
# webhook injects the common lmcache-mp-server native sidecar plus SGLang's
# --enable-lmcache/--lmcache-config-file launch surface. Kubernetes 1.29 or
# newer is required for native sidecars. SGLang TP>1 is outside the validated
# migration baseline.
apiVersion: inferencecache.io/v1alpha1
kind: CacheBackend
metadata:
  labels:
    app.kubernetes.io/name: inference-cache
  name: cachebackend-sglang
spec:
  runtime: SGLang
  type: LMCache
  integration:
    role: ReadWrite
  engineSelector:
    matchLabels:
      app.kubernetes.io/name: sglang
  lmCache:
    topology: PodLocal
    chunkSizeTokens: 256
    podLocal:
      server:
        image: docker.io/lmcache/standalone@sha256:b813bf0bb616d1012b6a6edcbd4a44f1576dbbdaa857962e56d48b9f7c127d13
        port: 5555
        l1Capacity: 4Gi
        maxWorkers: 4
        resources:
          requests:
            cpu: "1"
            memory: 5Gi
          limits:
            cpu: "2"
            memory: 6Gi
  observation:
    modelID: meta-llama/Meta-Llama-3-8B-Instruct
  remoteStorage:
    provider: Redis
    ownership: Managed
    redis:
      image: docker.io/library/redis@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2
      resources:
        requests:
          cpu: 500m
          memory: 4Gi
        limits:
          cpu: "2"
          memory: 8Gi
