apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cachepolicy-editor-role
rules:
- apiGroups:
  - inferencecache.io
  resources:
  - cachepolicies
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - inferencecache.io
  resources:
  - cachepolicies/status
  verbs:
  - get
