# Shared-cluster GPU validation overlay. Keep the shipped default install
# cluster-wide for its CRD/controller surfaces, but ask the API server to send
# Pod CREATE admission requests to the inference-cache mutator only from the
# dedicated test namespace. CacheBackend/CachePolicy/CacheTenant admission is
# intentionally unchanged. Image selection is environment-owned; set the
# controller, server, and optional subscriber images at deployment time.
resources:
- ../../default

patches:
- target:
    group: admissionregistration.k8s.io
    version: v1
    kind: MutatingWebhookConfiguration
    name: inference-cache-mutating-webhook-configuration
  patch: |
    - op: add
      path: /webhooks/0/namespaceSelector
      value:
        matchLabels:
          kubernetes.io/metadata.name: inference-cache-gpu-test
