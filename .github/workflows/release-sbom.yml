name: Release Supply Chain

on:
  release:
    types:
    - published
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to attach SBOM artifacts to
        required: true

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
  COSIGN_VERSION: v3.1.3
  SYFT_VERSION: v1.20.0
  CONTROLLER_IMAGE_REPO: ghcr.io/cachebox-project/inference-cache-controller
  SERVER_IMAGE_REPO: ghcr.io/cachebox-project/inference-cache-server
  SUBSCRIBER_IMAGE_REPO: ghcr.io/cachebox-project/inference-cache-subscriber

jobs:
  secure-release:
    name: Publish and Secure Release Images
    runs-on: ubuntu-latest
    permissions:
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
      packages: write
    steps:
    - name: Validate release tag
      env:
        RELEASE_TAG: ${{ env.RELEASE_TAG }}
      run: |
        set -euo pipefail
        if [[ ! "$RELEASE_TAG" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
          echo "Release tag must be a Docker-compatible tag: [A-Za-z0-9_][A-Za-z0-9_.-]{0,127}" >&2
          exit 1
        fi

    - name: Checkout SBOM tooling
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
      with:
        ref: ${{ github.workflow_sha }}
        persist-credentials: false

    - name: Verify GitHub Release exists
      env:
        GH_TOKEN: ${{ github.token }}
        RELEASE_TAG: ${{ env.RELEASE_TAG }}
      run: gh release view "$RELEASE_TAG" >/dev/null

    - name: Set up Syft
      uses: ./.github/actions/setup-syft
      with:
        version: ${{ env.SYFT_VERSION }}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5  # v4

    - name: Login to GitHub Container Registry
      uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ github.token }}

    - name: Checkout release source
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
      with:
        ref: refs/tags/${{ env.RELEASE_TAG }}
        path: release-source
        persist-credentials: false

    - name: Verify provenance source revision
      run: |
        set -euo pipefail
        release_sha="$(git -C release-source rev-parse HEAD)"
        if [ "$release_sha" != "$GITHUB_SHA" ]; then
          echo "Release source $release_sha does not match workflow source $GITHUB_SHA." >&2
          echo "For manual runs, select the release tag in the 'Use workflow from' control." >&2
          exit 1
        fi

    - name: Generate source SBOM
      run: make -f "$GITHUB_WORKSPACE/Makefile" -C "$GITHUB_WORKSPACE/release-source" sbom-release TAG="${RELEASE_TAG}" SBOM_DIR="$GITHUB_WORKSPACE/dist/sbom"

    - name: Generate published image SBOMs
      run: make -f "$GITHUB_WORKSPACE/Makefile" -C "$GITHUB_WORKSPACE/release-source" sbom-registry-images TAG="${RELEASE_TAG}" SBOM_DIR="$GITHUB_WORKSPACE/dist/sbom" SBOM_REGISTRY_PUBLISH_MISSING=1 SBOM_IMAGE_CONTEXT="$GITHUB_WORKSPACE/release-source" SBOM_DOCKERFILE="$GITHUB_WORKSPACE/release-source/dockerfiles/Dockerfile"

    - name: Resolve immutable release image digests
      id: image-digests
      env:
        DOCKER_BUILD_CMD: docker
      run: hack/resolve-release-image-digests.sh >> "$GITHUB_OUTPUT"

    - name: Set up Cosign
      uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2
      with:
        cosign-release: ${{ env.COSIGN_VERSION }}

    - name: Sign release images
      env:
        CONTROLLER_DIGEST: ${{ steps.image-digests.outputs.controller }}
        SERVER_DIGEST: ${{ steps.image-digests.outputs.server }}
        SUBSCRIBER_DIGEST: ${{ steps.image-digests.outputs.subscriber }}
      run: |
        set -euo pipefail
        cosign sign --yes "${CONTROLLER_IMAGE_REPO}@${CONTROLLER_DIGEST}"
        cosign sign --yes "${SERVER_IMAGE_REPO}@${SERVER_DIGEST}"
        cosign sign --yes "${SUBSCRIBER_IMAGE_REPO}@${SUBSCRIBER_DIGEST}"

    - name: Generate controller SLSA provenance
      id: attest-controller
      uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6  # v4.2.2
      with:
        subject-name: ${{ env.CONTROLLER_IMAGE_REPO }}
        subject-digest: ${{ steps.image-digests.outputs.controller }}
        subject-version: ${{ env.RELEASE_TAG }}
        push-to-registry: true

    - name: Generate server SLSA provenance
      id: attest-server
      uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6  # v4.2.2
      with:
        subject-name: ${{ env.SERVER_IMAGE_REPO }}
        subject-digest: ${{ steps.image-digests.outputs.server }}
        subject-version: ${{ env.RELEASE_TAG }}
        push-to-registry: true

    - name: Generate subscriber SLSA provenance
      id: attest-subscriber
      uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6  # v4.2.2
      with:
        subject-name: ${{ env.SUBSCRIBER_IMAGE_REPO }}
        subject-digest: ${{ steps.image-digests.outputs.subscriber }}
        subject-version: ${{ env.RELEASE_TAG }}
        push-to-registry: true

    - name: Collect provenance bundles
      env:
        CONTROLLER_BUNDLE: ${{ steps.attest-controller.outputs.bundle-path }}
        SERVER_BUNDLE: ${{ steps.attest-server.outputs.bundle-path }}
        SUBSCRIBER_BUNDLE: ${{ steps.attest-subscriber.outputs.bundle-path }}
      run: |
        set -euo pipefail
        mkdir -p dist/provenance
        cp -- "$CONTROLLER_BUNDLE" "dist/provenance/inference-cache-controller-${RELEASE_TAG}.provenance.sigstore.json"
        cp -- "$SERVER_BUNDLE" "dist/provenance/inference-cache-server-${RELEASE_TAG}.provenance.sigstore.json"
        cp -- "$SUBSCRIBER_BUNDLE" "dist/provenance/inference-cache-subscriber-${RELEASE_TAG}.provenance.sigstore.json"

    - name: Verify image signatures and SLSA provenance
      env:
        GH_TOKEN: ${{ github.token }}
        COSIGN_IDENTITY: https://github.com/${{ github.workflow_ref }}
        CONTROLLER_DIGEST: ${{ steps.image-digests.outputs.controller }}
        SERVER_DIGEST: ${{ steps.image-digests.outputs.server }}
        SUBSCRIBER_DIGEST: ${{ steps.image-digests.outputs.subscriber }}
      run: |
        set -euo pipefail
        for ref in \
          "${CONTROLLER_IMAGE_REPO}@${CONTROLLER_DIGEST}" \
          "${SERVER_IMAGE_REPO}@${SERVER_DIGEST}" \
          "${SUBSCRIBER_IMAGE_REPO}@${SUBSCRIBER_DIGEST}"; do
          cosign verify \
            --certificate-identity "$COSIGN_IDENTITY" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "$ref" >/dev/null
          gh attestation verify "oci://${ref}" \
            --repo "$GITHUB_REPOSITORY" \
            --bundle-from-oci \
            --cert-identity "$COSIGN_IDENTITY" \
            --deny-self-hosted-runners \
            --source-digest "$GITHUB_SHA" \
            --source-ref "$GITHUB_REF" \
            --predicate-type https://slsa.dev/provenance/v1 >/dev/null
        done

    - name: Upload release supply-chain artifacts
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
      with:
        name: release-supply-chain
        path: |
          dist/sbom/*.spdx.json
          dist/provenance/*.sigstore.json
        if-no-files-found: error

  attach-release-artifacts:
    name: Attach Supply-Chain Artifacts to GitHub Release
    runs-on: ubuntu-latest
    needs:
    - secure-release
    permissions:
      contents: write
    steps:
    - name: Download release supply-chain artifacts
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
      with:
        name: release-supply-chain
        path: dist

    - name: Attach supply-chain artifacts to GitHub Release
      env:
        GH_TOKEN: ${{ github.token }}
        RELEASE_TAG: ${{ env.RELEASE_TAG }}
      run: gh release upload "${RELEASE_TAG}" dist/sbom/*.spdx.json dist/provenance/*.sigstore.json --clobber
