# Build the documentation site (site/) and publish it to GitHub Pages.
# Free for public repositories. No Node/npm toolchain is required — the CSS
# pipeline uses Hugo Extended's built-in SCSS support (see site/layouts/partials/head-css.html).
#
# One-time setup: repository Settings -> Pages -> Build and deployment ->
# Source: "GitHub Actions". The site is then served at
# https://cachebox-project.github.io/inference-cache/
name: Docs

on:
  pull_request:
    paths:
      - "site/**"
      - ".github/workflows/docs.yml"
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

# Serialize deployments while allowing each PR to validate independently.
concurrency:
  group: docs-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    env:
      HUGO_VERSION: 0.164.0
      HUGO_SHA256: 8325f3653032d0fc536503691f4833dc4eb6c6be02ee62466758f3f37a7f2fcd
    steps:
      - name: Install Hugo (extended)
        run: |
          wget -O "${{ runner.temp }}/hugo.deb" \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          echo "${HUGO_SHA256}  ${{ runner.temp }}/hugo.deb" | sha256sum --check -
          sudo dpkg -i "${{ runner.temp }}/hugo.deb"
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # for .Lastmod / enableGitInfo
      - name: Setup Go # Hugo fetches the Docsy theme as a Go module
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.22"
      - name: Setup Pages
        if: github.event_name != 'pull_request'
        id: pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Build
        working-directory: site
        env:
          HUGO_ENVIRONMENT: production
        run: hugo --gc --minify --baseURL "https://cachebox-project.github.io/inference-cache/"
      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: site/public

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
