baseURL = "/"
title = "inference-cache"

enableRobotsTXT = true

###############################################################################
# Docsy
###############################################################################
enableGitInfo = true

# language settings
contentDir = "content/en"
defaultContentLanguage = "en"
# tell Hugo not to include the /en/ element in the URL path for English docs
defaultContentLanguageInSubdir = false
# useful when translating
enableMissingTranslationPlaceholders = true
# disable taxonomies
disableKinds = ["taxonomy"]
# deprecated directories
ignoreFiles = []

###############################################################################
# Hugo - Top-level navigation (horizontal)
###############################################################################
[menu]

  [[menu.main]]
    name = "GitHub"
    weight = 99
    pre = "<i class='fab fa-github pr-2'></i>"
    url = "https://github.com/cachebox-project/inference-cache"

###############################################################################
# Docsy - Goldmark markdown parser
###############################################################################
[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    # See a complete list of available styles at https://xyproto.github.io/splash/docs/all.html
    style = "tango"
    guessSyntax = "true"

###############################################################################
# Docsy - Image processing configuration
###############################################################################
[imaging]
  resampleFilter = "CatmullRom"
  quality = 75
  anchor = "smart"

###############################################################################
# Docsy - Language configuration
###############################################################################
[languages]
  [languages.en]
    label = "English"
    # weight used for sorting in the language menu
    weight = 1

###############################################################################
# Docsy - Site Parameters
###############################################################################
[params]
  github_repo = "https://github.com/cachebox-project/inference-cache"
  github_project_repo = "https://github.com/cachebox-project/inference-cache"
  github_subdir = "site"
  author = "The inference-cache authors"
  github = "cachebox-project"

  copyright = "The inference-cache authors"
  # Apache-2.0 licensed, developed in the open under the cachebox-project org.

  prism_syntax_highlighting = true
  # Text label for the version menu in the top bar of the website.
  version_menu = "Version"

  # The major.minor version tag for the version of the docs represented in this
  # branch of the repository. Used in the "version-banner" partial to display a
  # version number for this doc set.
  version = "v1alpha1"

  # Flag used in the "version-banner" partial to decide whether to display a
  # banner on every page indicating that this is an archived version of the docs.
  archived_version = false

  # A variable used in various docs to determine URLs for config files etc.
  githubbranch = "main"

  # User interface configuration
  [params.ui]
    # Disable the logo (no logo asset shipped; the site title stands in).
    navbar_logo = false
    # Enable to show the side bar menu in its compact state.
    sidebar_menu_compact = true
    # Enable the search box in the side bar.
    sidebar_search_disable = false
    # Set to true to disable breadcrumb navigation.
    breadcrumb_disable = false
    # Show expand/collapse icon for sidebar sections
    sidebar_menu_foldable = true
    # Disable about button in footer
    footer_about_disable = true

[params.links]
# End user relevant links. These will show up on left side of footer and in the community page if you have one.
  [[params.links.user]]
    name = "GitHub"
    url = "https://github.com/cachebox-project/inference-cache"
    icon = "fab fa-github"
    desc = "Development takes place here"
  [[params.links.user]]
    name = "Issues"
    url = "https://github.com/cachebox-project/inference-cache/issues"
    icon = "fa fa-bug"
    desc = "Report a bug or request a feature"

[module]
  proxy = "direct"
  [module.hugoVersion]
    extended = true
  [[module.imports]]
    path = "github.com/google/docsy"
    disable = false
